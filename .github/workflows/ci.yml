name: CI

# Обязательный зелёный гейт = аппрувер мержа (ADR-0002 §4 амендмент 2026-06-25,
# постулат 30, pool #027). Без зелёного CI зрелый PR не мержится; авто-мерж
# опирается ровно на эти проверки, поэтому гейт не должен быть пустым.

on:
  push:
    branches: ['**']
  pull_request:

# Один прогон на ветку — новый пуш отменяет предыдущий незавершённый.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-quality:
    runs-on: ubuntu-latest

    # Гейту нужны только чтение и запуск кода: ни одного секрета в джобе нет, токен
    # репозитория джобой не используется (persist-credentials:false ниже). Явный
    # блок нужен, чтобы дефолт организации/репозитория не расширил права молча —
    # аудит #057 (вектор e).
    permissions:
      contents: read

    # Postgres-сервис: payload.config работает с push:true (схема синхронизируется
    # при инициализации). lint/typecheck/build БД не трогают, но сервис заложен
    # для будущих интеграционных тестов, дёргающих payload.init (#011/M2+).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: trener_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trener_ci
      PAYLOAD_SECRET: ci-secret-not-for-production
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Токен не нужен джобу (ничего не пушим) и не должен лежать в .git/config,
          # где его достанет любой код из pnpm install/build. Аудит #057 (вектор e).
          # Именно внутри with:, не соседом с uses: — соседняя позиция делает весь
          # файл невалидным ПО СХЕМЕ GitHub: воркфлоу исчезает, dispatch не работает,
          # а на каждый пуш прилетает красный прогон 0с. Ловится шагом ниже.
          persist-credentials: false

      # D-038: публичный репозиторий — recon-поверхность. Generic-грепы по отслеживаемым
      # файлам (тех-хостнейм VPS, «Бокс N», публичный IPv4, /home/<user>/, ssh-алиас,
      # unix-пользователь); правило и исключения — AGENTS.md. Внутри required-джоба,
      # чтобы гейт был обязательным без правки branch protection.
      - name: Recon-lint (D-038)
        working-directory: .
        run: bash scripts/recon-lint.sh

      # Схема workflow по СПЕЦИФИКАЦИИ GitHub. YAML-парсеры сюда не смотрят: файл может
      # быть синтаксически валидным и при этом невалидным по схеме — тогда GitHub не
      # просто ругает шаг, а ОТВЕРГАЕТ ВЕСЬ ФАЙЛ: воркфлоу исчезает из списка,
      # dispatch не работает, на каждый пуш прилетает красный прогон 0с. Именно так
      # молча сломался apply-migration.yml (регресс волны 1 #189: persist-credentials
      # стоял соседом с `uses:`), и накат миграций на прод перестал работать.
      #
      # Версия и sha256 зафиксированы: бинарь actionlint — исполняемый код в джобе,
      # поэтому качать его можно только с обязательной сверкой (шаг падает на mismatch).
      - name: Workflow-schema-lint (actionlint)
        working-directory: .
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -e
          ASSET="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          BASE="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -fsSL "$BASE/$ASSET" -o /tmp/actionlint.tar.gz
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          # -ignore только репозиторные проверки: код и комментарии на русском,
          # shellcheck/pyflakes в образе нет. Проверка схемы и выражений остаётся.
          /tmp/actionlint -no-color -ignore 'pyflakes*' -ignore 'shellcheck*' .github/workflows/*.yml

      # pnpm/action-setup ставит pnpm напрямую (без corepack) → обходит G53
      # («download pnpm? Y/n» виснет на headless) и corepack-в-subdir (packageManager
      # лежит в web/package.json, не в корне). Версия пинится под packageManager.
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # Канонический lockfile — pnpm-lock.yaml (G52: расхождение lockfile'ов ломает CI).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Payload types
        run: pnpm generate:types

      - name: Generate Payload import map
        run: pnpm generate:importmap

      # Гейт «типы в репозитории свежие» (заведён 30.07 после красного прод-деплоя).
      # CI сам генерит payload-types.ts перед проверками, поэтому УСТАРЕВШИЙ файл в
      # коммите проходил здесь зелёным — и падал только на `next build` в деплое, уже
      # после мержа и наката миграции на прод. Сравниваем сгенерённое с закоммиченным
      # (пробелы игнорируем: генератор пишет CRLF на Windows-машине разработчика).
      - name: Payload types в коммите совпадают со сгенерёнными
        run: |
          if ! git diff --quiet --ignore-all-space -- src/payload-types.ts; then
            echo "::error::src/payload-types.ts устарел — выполните 'pnpm -C web generate:types' и закоммитьте результат"
            git diff --ignore-all-space -- src/payload-types.ts | head -40
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Dead code (knip)
        run: pnpm deadcode

      - name: Build
        run: pnpm build

      # Смоук деплоя — гейт, и его самого надо проверять. Прогон по живому проду ничего
      # не доказывает: живой прод зелёный и у декоративной проверки, которая всегда
      # возвращает «ок». Селфтест поднимает фикстурный сервер и требует, чтобы смоук был
      # зелёным на исправном и краснел на каждом из сломанных режимов — вторая половина
      # важнее первой и обычно не проверяется.
      #
      # Правило «правишь смоук — гоняй фикстурами» жило в handoff'е с 24.08, но сами
      # фикстуры не были закоммичены, и выполнить его было нечем. Здесь оно становится
      # обязательным, а не устным. Node уже стоит шагом выше; веб-приложение не нужно.
      - name: Самопроверка смоука на фикстурах
        working-directory: .
        run: bash scripts/smoke-selftest.sh
